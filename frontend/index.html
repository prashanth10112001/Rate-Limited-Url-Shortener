<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create clean short URLs, manage your links, and follow aggregate click activity."
    />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Linkly — URL shortener</title>
    <script>
      const savedTheme = localStorage.getItem("linkly.theme")
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light"
      const initialTheme =
        savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme
      document.documentElement.dataset.theme = initialTheme
      document.documentElement.style.colorScheme = initialTheme
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", initialTheme === "dark" ? "#09090b" : "#f8fafc")
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
